# Runs behind the QS Pro Caddy (HTTPS) on the qspro_default network.
ServerName vuathau.com.vn
ServerTokens Prod
ServerSignature Off

# Real visitor IP for the form throttle: trust X-Forwarded-For only from the compose network.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.30.0.0/24

<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
</Directory>
# Apache only sees http here, so its own trailing-slash redirect would send visitors to http://.
RedirectMatch 301 ^/nha-thau$ https://vuathau.com.vn/nha-thau/

<Files "_lib.php">
    Require all denied
</Files>
<LocationMatch "/assets/">
    Header set Cache-Control "public, max-age=2592000"
</LocationMatch>
