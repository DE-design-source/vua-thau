# vuathau.com.vn behind Cloudflare (proxied, SSL mode "Full", Origin Rule: destination port 8443).
# QS Pro's Caddy owns 80/443 on this server, so the site has its own port that only Cloudflare may reach.
ServerName vuathau.com.vn
ServerTokens Prod
ServerSignature Off

# Real visitor IP (form throttle, logs) from Cloudflare's header, trusted only from Cloudflare.
# ponytail: Cloudflare ranges hard-coded (cloudflare.com/ips, 2026-11); refresh if Cloudflare adds ranges.
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

Listen 8443
<VirtualHost *:8443>
    SSLEngine on
    # Self-signed: Cloudflare "Full" encrypts to the origin without validating it.
    SSLCertificateFile /etc/ssl/certs/vuathau-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/vuathau-origin.key
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://vuathau.com.vn%{REQUEST_URI} [R=301,L]
    # Apache only knows its own port, so its trailing-slash redirect would point at :8443.
    RewriteRule ^/nha-thau$ https://vuathau.com.vn/nha-thau/ [R=301,L]

</VirtualHost>

<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
    # Only Cloudflare and local checks may connect. CONN_REMOTE_ADDR is the TCP peer, not the
    # visitor IP mod_remoteip substitutes. (<Files> below still overrides this for _lib.php.)
    Require expr \
        %{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8' || \
        %{CONN_REMOTE_ADDR} -ipmatch '173.245.48.0/20' || \
        %{CONN_REMOTE_ADDR} -ipmatch '103.21.244.0/22' || \
        %{CONN_REMOTE_ADDR} -ipmatch '103.22.200.0/22' || \
        %{CONN_REMOTE_ADDR} -ipmatch '103.31.4.0/22' || \
        %{CONN_REMOTE_ADDR} -ipmatch '141.101.64.0/18' || \
        %{CONN_REMOTE_ADDR} -ipmatch '108.162.192.0/18' || \
        %{CONN_REMOTE_ADDR} -ipmatch '190.93.240.0/20' || \
        %{CONN_REMOTE_ADDR} -ipmatch '188.114.96.0/20' || \
        %{CONN_REMOTE_ADDR} -ipmatch '197.234.240.0/22' || \
        %{CONN_REMOTE_ADDR} -ipmatch '198.41.128.0/17' || \
        %{CONN_REMOTE_ADDR} -ipmatch '162.158.0.0/15' || \
        %{CONN_REMOTE_ADDR} -ipmatch '104.16.0.0/13' || \
        %{CONN_REMOTE_ADDR} -ipmatch '104.24.0.0/14' || \
        %{CONN_REMOTE_ADDR} -ipmatch '172.64.0.0/13' || \
        %{CONN_REMOTE_ADDR} -ipmatch '131.0.72.0/22' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2400:cb00::/32' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2606:4700::/32' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2803:f800::/32' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2405:b500::/32' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2405:8100::/32' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2a06:98c0::/29' || \
        %{CONN_REMOTE_ADDR} -ipmatch '2c0f:f248::/32'
</Directory>
<Files "_lib.php">
    Require all denied
</Files>
<LocationMatch "/assets/">
    Header set Cache-Control "public, max-age=2592000"
</LocationMatch>
